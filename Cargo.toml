[package]
name = "ralph"
version = "0.1.3"
edition = "2021"
authors = ["Madhava Jay <madhava@openmined.org>"]
description = "A CLI agent harness for running AI coding agents (Codex, Claude, Pi, Gemini)"
license = "Apache-2.0"
repository = "https://github.com/madhavajay/ralph"
keywords = ["cli", "ai", "agent", "codex", "claude"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "ralph"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
which = "7.0"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = "0.4"
dialoguer = "0.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
